# Bambu Studio — Starship 1:200 hex (P1S / X1C / A1)
# Open starship_1_200_hex_tiles_mmu.3mf, then set Process to match:
#
# layer_height: 0.16 or 0.20 (Fine)
# wall_loops: 3
# sparse_infill_density: 15%
# sparse_infill_pattern: gyroid
# enable_support: true
# support_type: normal(auto) or tree — restrict to forward flaps if painting
# brim_type: no_brim (add outer brim only if adhesion fails)
#
# Orientation: nose up, engines on bed.
# AMS: Stainless hull = silver/grey, Heat shield + Raptors = black
# Bed: needs Z ≥ 261 mm at 100% scale
#
# Custom name: https://leedsexplore.github.io/starship-custom-name/
# Canonical Printables: https://www.printables.com/model/1792868
