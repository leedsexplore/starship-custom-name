# Bambu Studio — Starship 1:200 hex (P1S / X1C / A1)
# Open the STL or MMU 3MF, then set Process to match:
#
# layer_height: 0.16 (crisp hex) or 0.20 (faster)
# wall_loops: 3
# sparse_infill_density: 15%
# sparse_infill_pattern: gyroid
# enable_support: true — paint / restrict to FORWARD flaps only
# support_type: tree(auto) preferred; never leave full-model Everywhere
# brim_type: no_brim (outer brim only if adhesion fails)
#
# Orientation: nose up, engines on bed.
# AMS: Stainless hull = silver/grey · Heat shield + Raptors = black
# Bed: Z ≥ 261 mm at 1:200 · A1 mini → use 1:300 one-piece
#
# Named: https://leedsexplore.github.io/starship-custom-name/ → STL (hex on)
# Canonical: https://www.printables.com/model/1792868
