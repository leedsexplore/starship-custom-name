# Printables listing for the ORIGINAL parametric Starship CAD.
# Copy this folder into printables-integration/packages/ and publish with:
#   printables validate packages/starship-parametric
#   printables publish packages/starship-parametric --draft --no-dry-run --confirm
#   printables publish packages/starship-parametric --no-dry-run --confirm
#
# This is original work (openscad/starship_parametric.scad, built from published
# dimensions) — NOT a remix, so there is no remix_of and the license is CC BY 4.0.

[model]
title = "SpaceX Starship 1:200 — One-Piece Print, MMU Two-Color, Custom Name (Parametric CAD)"
summary = "Original parametric Starship CAD: prints in ONE piece with zero assembly, MMU3-ready two-color 3MF with hex-tile heat shield, plus a free web customizer that puts any name on the hull."
license = "CC BY 4.0"
category_id = "82" # Other Ideas — adjust in the Printables UI if a better fit exists
tags = [
  "spacex",
  "starship",
  "rocket",
  "space",
  "customizable",
  "parametric",
  "openscad",
  "multi-material",
  "mmu3",
  "single-piece",
  "no-assembly",
]

[files]
include = ["files/**/*.stl", "files/**/*.3mf", "files/**/*.scad"]

[images]
cover = "images/01-cover-custom-name.png"
include = ["images/**/*.png"]

[description]
file = "DESCRIPTION.md"
